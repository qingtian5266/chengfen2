version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lawyer-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: lawyer
      MYSQL_USER: lawyer
      MYSQL_PASSWORD: lawyer123
      TZ: Asia/Shanghai
    ports:
      - '3306:3306'
    volumes:
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
